name: Bug report
description: Report an emulator crash, incorrect result, or application compatibility problem.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve CPUEmu. Do not attach proprietary application binaries.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CPUEmu version or commit
      placeholder: CPUEmu 0.1.0 or commit hash
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the command, guest architecture, and smallest reproducible case.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Use --log-level api or trace where useful, and remove private information.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed secrets and private data from logs.
          required: true
